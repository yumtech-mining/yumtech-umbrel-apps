name: Build YUMTECH Arbitrage image

on:
  pull_request:
    paths:
      - ".github/workflows/build-yumtech-arbitrage.yml"
      - "yumtech-arbitrage/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-yumtech-arbitrage.yml"
      - "yumtech-arbitrage/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e './yumtech-arbitrage[test]'
      - run: pytest -q
        working-directory: yumtech-arbitrage
      - name: Validate runtime and dashboard sources
        run: |
          bash -n yumtech-arbitrage/app/entrypoint.sh
          bash -n yumtech-arbitrage/hummingbot-runtime/entrypoint.sh
          node --check yumtech-arbitrage/dashboard/app.js
          python -m compileall -q yumtech-arbitrage/app yumtech-arbitrage/hummingbot-runtime
      - name: Validate Umbrel Compose contract
        run: |
          APP_DATA_DIR=/tmp/yumtech-arbitrage-data \
            docker compose --project-name yumtech-arbitrage-validation \
            --file yumtech-arbitrage/docker-compose.yml config >/dev/null

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: yumtech-arbitrage
          file: yumtech-arbitrage/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/yumtech-arbitrage:0.3.1
            ghcr.io/${{ github.repository_owner }}/yumtech-arbitrage:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-hummingbot:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: yumtech-arbitrage
          file: yumtech-arbitrage/hummingbot-runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/yumtech-hummingbot:0.3.1
            ghcr.io/${{ github.repository_owner }}/yumtech-hummingbot:latest
          cache-from: type=gha,scope=hummingbot
          cache-to: type=gha,mode=max,scope=hummingbot
