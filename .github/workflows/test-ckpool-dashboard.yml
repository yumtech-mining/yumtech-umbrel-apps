name: Test CKPool Dashboard

on:
  push:
    paths:
      - "ckpool-dashboard/**"
      - ".github/workflows/test-ckpool-dashboard.yml"
  pull_request:
    paths:
      - "ckpool-dashboard/**"
      - ".github/workflows/test-ckpool-dashboard.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: ckpool-dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh uninstall.sh
      - run: node --check yumtech_dashboard/static/app.js
