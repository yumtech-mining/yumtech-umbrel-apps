services:
  db:
    image: timescale/timescaledb@sha256:981e3016a2810fec47515e3828ad70ae97b84f4c9ef63d032180b54f61566fd6
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: mkpool
      POSTGRES_USER: mkpool_user
      POSTGRES_PASSWORD: ${YUMTECH_DB_PASSWORD:?YUMTECH_DB_PASSWORD is required}
      TIMESCALEDB_TELEMETRY: "off"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkpool_user -d mkpool"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - "${YUMTECH_DATA_DIR:?YUMTECH_DATA_DIR is required}/postgres:/var/lib/postgresql/data"

  mkpool:
    image: ghcr.io/yumtech-mining/yumtech@sha256:7db4957fcca3b810ea8474375e24621c43c26111e74b5867580c99d2dc47e4c3
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - /bin/sh
      - -c
      - |
          set -eu
          python3 /opt/yumtech/dashboard/ensure_sv2_identity.py
          until python3 /opt/yumtech/dashboard/ensure_database_state.py; do
            echo "Waiting for the YUMTECH database state..."
            sleep 2
          done
          exec /opt/yumtech/scripts/start-mkpool.sh
    depends_on:
      - db
    ports:
      - "0.0.0.0:3333:3333/tcp"
      - "0.0.0.0:3340:3340/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: mkpool
      DB_USER: mkpool_user
      DB_PASS: ${YUMTECH_DB_PASSWORD}
      BITCOIN_RPC_HOST: ${BITCOIN_RPC_HOST}
      BITCOIN_RPC_PORT: ${BITCOIN_RPC_PORT}
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${BITCOIN_RPC_PASS}
      BITCOIN_ZMQ_HOST: ${BITCOIN_ZMQ_HOST}
      BITCOIN_ZMQ_HASHBLOCK_PORT: ${BITCOIN_ZMQ_HASHBLOCK_PORT}
      BITCOIN_ZMQ_RAWBLOCK_PORT: ${BITCOIN_ZMQ_RAWBLOCK_PORT}
      BITCOIN_IPC_SOCKET: ${BITCOIN_IPC_SOCKET:-}
      BITCOIN_IPC_TEMPLATE: ${BITCOIN_IPC_TEMPLATE:-true}
      BITCOIN_IPC_FEE_THRESHOLD: ${BITCOIN_IPC_FEE_THRESHOLD:-0}
      SV2_PRIVATE_KEY_FILE: /data/secrets/sv2-authority-private.hex
      SV2_PUBLIC_KEY_FILE: /data/public/sv2-authority-public.hex
      SV2_FINGERPRINT_FILE: /data/public/sv2-authority-fingerprint.txt
    volumes:
      - "${YUMTECH_DATA_DIR}/mkpool:/data"
      - "${YUMTECH_DATA_DIR}/runtime:/run/mkpool"
      - "${YUMTECH_DATA_DIR}/secrets:/data/secrets"
      - "${YUMTECH_DATA_DIR}/public:/data/public"
      - "${YUMTECH_DATA_DIR}/bitcoin-ipc:/run/bitcoin-ipc:ro"
    healthcheck:
      test:
        - CMD
        - python3
        - /opt/yumtech/mkpool-src/scripts/mkpool-ctl.py
        - --socket
        - /run/mkpool/mkpool.sock
        - ping
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  dashboard:
    image: ghcr.io/yumtech-mining/yumtech@sha256:7db4957fcca3b810ea8474375e24621c43c26111e74b5867580c99d2dc47e4c3
    restart: unless-stopped
    command:
      - python3
      - /opt/yumtech/dashboard/server.py
    depends_on:
      - db
      - mkpool
    ports:
      - "${YUMTECH_DASHBOARD_BIND:-0.0.0.0}:8095:8095/tcp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: mkpool
      DB_USER: mkpool_user
      DB_PASS: ${YUMTECH_DB_PASSWORD}
      MKPOOL_CTL: /opt/yumtech/mkpool-src/scripts/mkpool-ctl.py
      MKPOOL_SOCKET: /run/mkpool/mkpool.sock
      DASHBOARD_PORT: "8095"
      SV2_PUBLIC_KEY_FILE: /data/public/sv2-authority-public.hex
      BITCOIN_RPC_HOST: ${BITCOIN_RPC_HOST}
      BITCOIN_RPC_PORT: ${BITCOIN_RPC_PORT}
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER}
      BITCOIN_RPC_PASS: ${BITCOIN_RPC_PASS}
    volumes:
      - "${YUMTECH_DATA_DIR}/runtime:/run/mkpool"
      - "${YUMTECH_DATA_DIR}/public:/data/public:ro"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/api/overview', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
