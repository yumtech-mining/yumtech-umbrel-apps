version: "3.7"

services:
  hummingbot:
    image: ghcr.io/yumtech-mining/yumtech-hummingbot:0.4.2
    restart: on-failure
    init: true
    environment:
      YUMTECH_ENGINE_VERSION: v2.16.0
      YUMTECH_TELEMETRY_DISABLED: "true"
      YUMTECH_LIVE_TRADING_ENABLED: "false"
      YUMTECH_STATUS_FILE: /home/hummingbot/yumtech-data/hummingbot-status.json
      YUMTECH_CONTROL_FILE: /home/hummingbot/yumtech-data/hummingbot-control.json
      YUMTECH_PAPER_CONFIG_FILE: /home/hummingbot/yumtech-data/hummingbot-paper-config.json
    volumes:
      - ${APP_DATA_DIR}/hummingbot/conf:/home/hummingbot/conf
      - ${APP_DATA_DIR}/hummingbot/logs:/home/hummingbot/logs
      - ${APP_DATA_DIR}/hummingbot/data:/home/hummingbot/data
      - ${APP_DATA_DIR}/data:/home/hummingbot/yumtech-data
    command: ["python", "-u", "/opt/yumtech-control-supervisor.py"]
    # Hummingbot exchange endpoints remain reachable; known CoinAlpha
    # telemetry hosts resolve to the container loopback and cannot exfiltrate.
    extra_hosts:
      - "api.coinalpha.com:127.0.0.1"
      - "reporting.hummingbot.org:127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "test -s /home/hummingbot/yumtech-data/hummingbot-status.json"]
      interval: 30s
      timeout: 5s
      retries: 3

  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    environment:
      APP_HOST: yumtech-arbitrage_dashboard_1
      APP_PORT: 8098

  dashboard:
    image: ghcr.io/yumtech-mining/yumtech-arbitrage:0.4.2
    depends_on:
      hummingbot:
        condition: service_healthy
    restart: on-failure
    stop_grace_period: 20s
    environment:
      YUMTECH_DATA_DIR: /data
      YUMTECH_DASHBOARD_DIR: /app/dashboard
      YUMTECH_LIVE_TRADING_ARMED: "false"
      YUMTECH_TARGET_TRY: "1000"
      YUMTECH_MIN_NET_PROFIT_PCT: "0.40"
    volumes:
      - ${APP_DATA_DIR}/data:/data
