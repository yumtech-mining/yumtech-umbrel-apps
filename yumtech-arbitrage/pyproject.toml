[project]
name = "yumtech-arbitrage"
version = "0.2.1"
description = "Local-first BTCTurk / Binance TR arbitrage control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "cryptography==45.0.6",
  "argon2-cffi==25.1.0",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "websockets==15.0.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
