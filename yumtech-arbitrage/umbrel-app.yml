tagline: BTCTürk ve Binance TR için yerel arbitraj kontrol merkezi
description: >-
  YUMTECH Arbitrage, BTCTürk ile Binance TR'deki ortak aktif TRY spot
  paritelerini izleyen, derinlik ve komisyon sonrası net fırsatları hesaplayan
  self-hosted bir kontrol merkezidir. Varsayılan test modu gerçek emir göndermez.

  Kullanıcı hesapları ve şifreli API anahtar kasaları birbirinden ayrılır.
  Raspberry Pi 5 4 GB hedefinde aynı anda yalnızca bir işlem profili etkin olur.
  Canlı mod, gözlem ve güvenlik kapıları tamamlanana kadar kilitlidir.
releaseNotes: >-
  v0.4.1 başlangıç düzeltmesi: Umbrel bind-mount altında eksik kalan Hummingbot
  conf/connectors klasörü otomatik oluşturulur. Hummingbot v2.16.0 ARM64 motoru, telemetrisi kapalı PaperTrade stratejisi olarak
  çalışır; beş saniyelik paper eşleşme gecikmesi, canlı order-book derinliği,
  kısmi dolum, sanal cüzdan, connector komisyon profili, BTCTürk market BUY TRY
  preflight'i, kontrol köprüsü, kalıcı yeterlilik sayaçları, mobil dashboard ve
  BOT sekmesinde per-borsa TRY bütçesi eklendi. Canlı emir bu sürümde kilitli.
