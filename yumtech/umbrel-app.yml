version: "0.4.0"
icon: "https://raw.githubusercontent.com/yumtech-mining/yumtech-umbrel-apps/main/yumtech/icon.png"
tagline: Bağımsız Bitcoin solo madencilik altyapısı
description: >-
  YUMTECH, Umbrel üzerinde çalışan kurumsal nitelikte, bağımsız ve
  self-hosted bir Bitcoin solo madencilik yönetim platformudur. Bitcoin Core
  veya Bitcoin Knots node'unuzla doğrudan çalışır; Stratum V1 ve Stratum V2 bağlantıları,
  otomatik vardiff, gerçek share difficulty, Best Share ve blok takibi sunar.

  ASIC cihazlar TCP 3333 üzerinden güvenli biçimde bağlanır. Solo madencilik
  ödemesi, Stratum kullanıcı adı olarak tanımlanan Bitcoin adresine yönelir.
  Havuz, node ve madencilik verileri kullanıcının kendi Umbrel sisteminde kalır.

  YUMTECH kontrol paneli canlı hashrate, aktif ASIC cihazları, paylaşımlar,
  Round Effort, bulunan bloklar ve bağlı Bitcoin node'unun durumunu tek merkezden,
  salt okunur operasyon ekranıyla izlemeyi sağlar.
releaseNotes: >-
  Bitcoin Core mining IPC desteği ve otomatik RPC/ZMQ geri dönüşü eklendi.
